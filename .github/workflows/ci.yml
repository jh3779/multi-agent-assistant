name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: import 체크
        run: python -c "import app.main"

      - name: 테스트 실행
        run: |
          set +e
          pytest -q
          code=$?
          set -e
          if [ $code -eq 5 ]; then
            echo "수집된 테스트 없음 — 통과 처리"
            exit 0
          fi
          exit $code
